# Generated by preconfig 0.1.0 from preconfig.yaml. Edit preconfig.yaml, not this file.
# Copilot runs the copilot-setup-steps job before it starts work. The workflow
# also runs when this file or preconfig.yaml changes, and then it ends with the
# ready check, so a pull request proves the setup before Copilot relies on it.
# Secrets (PAYMENTS_API_KEY) come from the repository's copilot environment.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - preconfig.yaml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - preconfig.yaml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
          POSTGRES_DB: orders
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set the project's environment
        run: |
          echo DATABASE_URL=postgres://orders:orders@localhost:5432/orders >> "$GITHUB_ENV"
          echo REDIS_URL=redis://localhost:6379/0 >> "$GITHUB_ENV"
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up the project
        env:
          PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Ready check
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          PAYMENTS_API_KEY: ${{ secrets.PAYMENTS_API_KEY }}
        run: |
          .venv/bin/pytest -q
