# Generated by preconfig 0.1.0 from preconfig.yaml. Edit preconfig.yaml, not this file.
# Copilot runs the copilot-setup-steps job before it starts work. The workflow
# also runs when this file or preconfig.yaml changes, and then it ends with the
# ready check, so a pull request proves the setup before Copilot relies on it.
# Secrets (INGEST_TOKEN) come from the repository's copilot environment.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - preconfig.yaml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - preconfig.yaml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      redis:
        image: redis:8
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set the project's environment
        run: |
          echo REDIS_URL=redis://localhost:6379/0 >> "$GITHUB_ENV"
      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Set up the project
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          go mod download
      - name: Ready check
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          go test ./...
