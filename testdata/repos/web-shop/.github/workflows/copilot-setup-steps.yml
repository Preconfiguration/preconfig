# Generated by preconfig 0.1.0 from preconfig.yaml. Edit preconfig.yaml, not this file.
# Copilot runs the copilot-setup-steps job before it starts work. The workflow
# also runs when this file or preconfig.yaml changes, and then it ends with the
# ready check, so a pull request proves the setup before Copilot relies on it.
# Secrets (SESSION_SECRET, STRIPE_API_KEY) come from the repository's copilot environment.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - preconfig.yaml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - preconfig.yaml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set the project's environment
        run: |
          echo DATABASE_URL=postgres://shop:shop@localhost:5432/shop >> "$GITHUB_ENV"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10"
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up the project
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          pnpm install --frozen-lockfile
      - name: Ready check
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          pnpm test
