# Generated by preconfig 0.1.0 from preconfig.yaml. Edit preconfig.yaml, not this file.
# The dev container (app) and its services. The services share app's network,
# so they answer on localhost inside the dev container.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu24.04
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
  postgres:
    image: postgres:16
    restart: unless-stopped
    network_mode: service:app
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    network_mode: service:app
volumes:
  postgres-data:
