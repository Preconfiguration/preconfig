name: release

# Builds the preconfig binaries, checks each one, and publishes them with a
# release.
#
# Releases go out on their own. When the tests pass on a push to main and the
# version in internal/kb/kb.go has no tag yet, this workflow builds the
# binaries from that commit with tools/build.sh, runs each one through
# tools/smoke.sh on its own system, then tags the commit and publishes the
# release with the binaries attached. Nothing goes public unless every build
# and check passes.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.
#
# Archive names carry no version, so links to
# releases/latest/download/preconfig_linux_amd64.tar.gz keep working.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true

permissions:
  contents: read

# The Go that built bin/, so the same source gives the same bytes.
env:
  GO_VERSION: "1.24.7"

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
          workflow_run)
            # Only the commit main is at now; if main has moved on, the run
            # after the next push decides.
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "No release: main has moved on from $RUN_SHA to $head."
              exit 0
            fi
            version=$(sed -n 's/^const Version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' internal/kb/kb.go)
            if [ -z "$version" ]; then
              echo "internal/kb/kb.go has no Version of the form X.Y.Z" >&2
              exit 1
            fi
            tags=$(git ls-remote --tags --refs origin) || { echo "Couldn't read the repository's tags" >&2; exit 1; }
            if grep -q "refs/tags/v$version\$" <<< "$tags"; then
              echo "No release: v$version is out already."
              exit 0
            fi
            newest=$({ grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' <<< "$tags" || true; } | sed 's|refs/tags/v||' | sort -V | tail -n 1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "v$version is older than the newest release, v$newest; raise the version above it" >&2
              exit 1
            fi
            echo "Releasing v$version from $RUN_SHA."
            { echo "tag=v$version"; echo "ref=$RUN_SHA"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            ;;
          release)
            { echo "tag=$RELEASE_TAG"; echo "ref=$RELEASE_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          esac

  # preconfig is pure Go with no cgo, so one Linux machine builds all five
  # binaries with tools/build.sh, the same way bin/ was built.
  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: bash tools/build.sh out
      - name: Compare with bin/
        # For the record only: bin/ may hold an older version.
        run: |
          (cd out && sha256sum preconfig-*) | tee built.txt
          if diff <(sort -k2 built.txt) <(sort -k2 bin/SHA256SUMS.txt) > /dev/null; then
            echo "The binaries match bin/SHA256SUMS.txt byte for byte."
          else
            echo "The binaries differ from bin/; bin/ holds another version."
          fi
      - name: Package
        run: |
          mkdir dist
          for f in out/preconfig-*; do
            name=$(basename "$f")
            platform=${name#preconfig-}
            platform=${platform%.exe}
            os=${platform%-*}
            arch=${platform#*-}
            pkg=pkg-$os-$arch
            mkdir "$pkg"
            if [ "$os" = windows ]; then exe=preconfig.exe; else exe=preconfig; fi
            cp "$f" "$pkg/$exe"
            chmod +x "$pkg/$exe"
            cp LICENSE NOTICE README.md bin/THIRD-PARTY-LICENSES.txt "$pkg/"
            if [ "$os" = windows ]; then
              (cd "$pkg" && zip -q -X "../dist/preconfig_${os}_${arch}.zip" *)
            else
              tar -czf "dist/preconfig_${os}_${arch}.tar.gz" -C "$pkg" .
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Each binary runs through tools/smoke.sh on its own system.
  check:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: preconfig_linux_amd64.tar.gz
            runner: ubuntu-latest
          - archive: preconfig_linux_arm64.tar.gz
            runner: ubuntu-24.04-arm
          - archive: preconfig_darwin_arm64.tar.gz
            runner: macos-latest
          - archive: preconfig_darwin_amd64.tar.gz
            runner: macos-latest
            rosetta: true
          - archive: preconfig_windows_amd64.zip
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The sample files have to reach the binary as they are in the repo.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Unpack
        run: |
          mkdir unpacked
          case "${{ matrix.archive }}" in
          *.zip) unzip -q "dist/${{ matrix.archive }}" -d unpacked ;;
          *) tar -xzf "dist/${{ matrix.archive }}" -C unpacked ;;
          esac
          ls -l unpacked
      - name: Smoke test
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          bin=unpacked/preconfig
          [ -f "$bin.exe" ] && bin=$bin.exe
          if [ "${{ matrix.rosetta }}" = true ] && ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "This Mac runner can't run Intel binaries, so the Intel binary is checked for its format only."
            file "$bin" | grep -q 'x86_64' || { file "$bin"; exit 1; }
            exit 0
          fi
          sh tools/smoke.sh "$bin" "${TAG#v}"

  release:
    needs: [plan, build, check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'EOF'
          Ready-built preconfig binaries. Each archive holds the `preconfig` command with its license files and the README.

          | System | File |
          |---|---|
          | Linux, x86-64 | preconfig_linux_amd64.tar.gz |
          | Linux, ARM64 | preconfig_linux_arm64.tar.gz |
          | macOS, Apple silicon | preconfig_darwin_arm64.tar.gz |
          | macOS, Intel | preconfig_darwin_amd64.tar.gz |
          | Windows, x86-64 | preconfig_windows_amd64.zip |

          SHA256SUMS lists the checksums. The binaries are static and built with `tools/build.sh`, so the same source gives the same bytes. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine preconfig`.
          EOF
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "Preconfig $TAG" --notes-file ../notes.md \
            preconfig_linux_amd64.tar.gz preconfig_linux_arm64.tar.gz preconfig_darwin_arm64.tar.gz preconfig_darwin_amd64.tar.gz preconfig_windows_amd64.zip SHA256SUMS
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            preconfig_linux_amd64.tar.gz preconfig_linux_arm64.tar.gz preconfig_darwin_arm64.tar.gz preconfig_darwin_amd64.tar.gz preconfig_windows_amd64.zip SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
